name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        # The suite stubs Home Assistant and aiohttp and lazy-imports
        # bleak/dbus_fast, so CI only needs the packages imported at collection
        # time. voluptuous is required by config_flow, which the reconfigure /
        # locale-coverage adversarial tests exercise (they self-skip without it).
        run: |
          python -m pip install --upgrade pip
          pip install pytest voluptuous pyyaml
      - name: Run unit tests
        run: python -m pytest tests/ -q
